pluginManagement {
	repositories {
		gradlePluginPortal()
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases'
		}
		maven {
			name = "Parchment"
			url = 'https://maven.parchmentmc.org'
		}
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

include ':tf-asm'