// Build MinecraftForge 1.21.1 du portage.
//
// L'original utilise ModDevGradle, qui ne connait que NeoForge. On repart donc de ForgeGradle 6,
// et volontairement au plus simple : source principale seule, sans shadow, sans jarJar, sans les
// integrations tierces (JEI, REI, EMI, Curios, The One Probe), qui n'existent qu'en artefacts
// -neoforge. Elles seront rebranchees une fois que le mod compilera.
//
// Le sous-projet tf-asm a disparu : Forge n'a pas d'API coremod, ses 31 transformateurs deviennent
// des mixins.

plugins {
	id 'java-library'
	id 'eclipse'
	id 'idea'
	id 'maven-publish'
	id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
	id 'org.spongepowered.mixin' version '0.7.+'
}

// Beanification (injection de dependances de Tamaized) est ecrite pour NeoForge : ni son plugin
// Gradle ni sa bibliotheque ne fonctionnent sous Forge. Twilight Forest n'en utilise que quatre
// annotations, reimplementees de zero dans twilightforest.forge.beans.

version = (hasProperty("CIRevision") ? CIRevision : project.mod_version)
group = group_name

base {
	archivesName = "${project.mod_id}-${project.minecraft_version}-forge"
}

java {
	toolchain {
		languageVersion.set(JavaLanguageVersion.of(21))
	}
}

minecraft {
	mappings channel: 'official', version: project.minecraft_version

	// Forge lit le meme format de transformateur d'acces que NeoForge : le fichier passe tel quel.
	accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))

	runs {
		client {
			workingDirectory project.file('run')
			property 'forge.logging.markers', 'REGISTRIES'
			property 'forge.logging.console.level', 'debug'
			mods {
				"${project.mod_id}" {
					source sourceSets.main
				}
			}
		}

		server {
			workingDirectory project.file('run')
			property 'forge.logging.console.level', 'debug'
			args '--nogui'
			mods {
				"${project.mod_id}" {
					source sourceSets.main
				}
			}
		}

		data {
			workingDirectory project.file('run-data')
			property 'forge.logging.console.level', 'debug'
			args '--mod', project.mod_id, '--all',
					'--output', file('src/generated/resources/').getAbsolutePath(),
					'--existing', file('src/main/resources/').getAbsolutePath()
			mods {
				"${project.mod_id}" {
					source sourceSets.main
				}
			}
		}
	}
}

mixin {
	add sourceSets.main, "${project.mod_id}.refmap.json"
	config "${project.mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

sourceSets {
	main {
		java {
			// Integrations tierces mises de cote : JEI, REI, EMI, Jade, Curios et The One Probe
			// n'existent qu'en artefacts -neoforge. Elles se rebranchent une fois le mod compilant,
			// et elles sont toutes regroupees ici, ce qui rend l'exclusion propre.
			exclude 'twilightforest/compat/**'

			// Generation de donnees mise de cote au meme titre : elle s'appuie sur les data maps de
			// NeoForge, qui n'ont pas d'equivalent. Les sous-paquets data/tags et data/helpers
			// restent compiles — ils portent des constantes lues a l'execution, pas du datagen.
			exclude 'twilightforest/data/*.java'

			// Aide de generation de recettes : elle s'appuie sur des constructeurs qui acceptent une
			// pile d'objets, ce que NeoForge ajoute et pas Forge. Elle ne sert qu'au datagen, deja hors
			// du build.
			exclude 'twilightforest/data/helpers/CraftingDataHelper.java'

			// Constructeurs de modeles pour la generation de donnees : le CustomLoaderBuilder de Forge
			// n'a pas la meme signature. Ils ne servent qu'au datagen, deja hors du build.
			exclude 'twilightforest/client/model/block/aurorablock/NoiseVaryingModelBuilder.java'
			exclude 'twilightforest/client/model/block/forcefield/ForceFieldModelBuilder.java'
			exclude 'twilightforest/client/model/block/carpet/RoyalRagsBuilder.java'


			// Calques jamais utilises, meme dans l'original (OverlayHandler fait le travail) ; ils
			// s'appuient sur les hauteurs d'interface de NeoForge, absentes chez Forge.
			exclude 'twilightforest/client/overlay/PortalOverlay.java'
			exclude 'twilightforest/client/overlay/QuestingRamIndicatorOverlay.java'
			exclude 'twilightforest/client/overlay/ShieldOverlay.java'

			// Rendus d'icones de carte : Forge n'a pas d'interface equivalente.
			exclude 'twilightforest/client/renderer/map/**'
			exclude 'twilightforest/client/model/block/connected/ConnectedTextureBuilder.java'
			exclude 'twilightforest/client/model/block/giantblock/GiantBlockBuilder.java'
			exclude 'twilightforest/data/helpers/TFSoundProvider.java'
		}
	}
}

// Classes et ressources dans un meme dossier de sortie, comme le MDK officiel de Forge 1.21.1.
// Sans ca, en developpement, Forge decouvre le mod par le classpath entree par entree : il prend
// build/resources/main (qui contient mods.toml) pour un mod a lui seul, n'y trouve aucune classe
// @Mod, et s'arrete sur « has mods that were not found ».
sourceSets.each {
	def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
	it.output.resourcesDir = dir
	it.java.destinationDirectory = dir
}

repositories {
	mavenLocal()
}

dependencies {
	minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

	// Beanification remplacee par twilightforest.forge.beans : ecrite pour NeoForge, elle ne se
	// charge pas sous Forge (net.neoforged.fml.ModList introuvable au premier appel).

	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
	exclude 'data/twilightforest/function/**'

	manifest {
		attributes([
				'Specification-Title'     : project.mod_id,
				'Specification-Vendor'    : 'TeamTwilight',
				'Specification-Version'   : '1',
				'Implementation-Title'    : project.name,
				'Implementation-Version'  : project.version,
				'Implementation-Vendor'   : 'TeamTwilight',
				'MixinConfigs'            : "${project.mod_id}.mixins.json"
		])
	}
}

// Le jeu publie porte des noms obfusques (m_20993_ et compagnie), pas les noms lisibles du
// developpement. Sans ce bloc, ForgeGradle ne cree meme pas la tache de traduction : le jar
// obtenu ne fonctionne qu'en developpement, et MixinGradle n'y depose pas la table de
// correspondance dont les mixins ont besoin pour retrouver leurs cibles en jeu.
reobf {
	jar {}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	// javac s'arrete a 100 erreurs par defaut ; pendant un portage on veut la liste entiere.
	options.compilerArgs << '-Xmaxerrs' << '100000'
}


